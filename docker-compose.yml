
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practice}
      POSTGRES_USER: ${POSTGRES_USER:-practice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}
    ports:
      - "127.0.0.1:543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-practice}:${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}@db:5432/${POSTGRES_DB:-practice}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command:
      - uvicorn
      - chatbot.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-practice}:${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}@db:5432/${POSTGRES_DB:-practice}
      MCP_SERVER_URL: http://mcp-server:8001/mcp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
